services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - atlas-pg:/var/lib/postgresql/data
      - ./ontology/010_runtime.sql:/docker-entrypoint-initdb.d/010_runtime.sql:ro

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      INEGI_TOKEN: ${INEGI_TOKEN:-}
      ATLAS_CACHE: /var/cache/atlas
    volumes:
      - atlas-cache:/var/cache/atlas
    depends_on:
      db:
        condition: service_healthy

volumes:
  atlas-pg:
  atlas-cache:
