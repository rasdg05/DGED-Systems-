name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt -r services/dataroom/requirements.txt -r services/satelite/requirements.txt -r services/agente/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Score live, Oráculo, acceso e invariantes (sin red), con cobertura
        # Piso: cobertura de atlas + dataroom + satelite al integrar el satélite (70.82%, 2026-10-13).
        # Bajó de 73 porque entraron los módulos de red y CLI del satélite (cambios.py, lote.py, stac.py). Sube; no baja.
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=70

      - name: Lector del cuarto de datos (sin red ni clave, cliente grabado)
        run: python -m pytest -q services/dataroom/tests

      - name: Ojo satelital (services/satelite, arreglos sintéticos, sin red)
        # También corre dentro del paso anterior (testpaths); aquí va solo para
        # que un rojo del satélite se vea con su nombre.
        run: python -m pytest -q services/satelite -p no:cacheprovider

      - name: Score de escritorio
        run: node --test packages/score/score.test.mjs

      - name: Smoke import del API
        working-directory: services/api
        run: python -c "import atlas.score, atlas.main, atlas.access, atlas.oracle"

      - name: Smoke import del agente
        working-directory: services/agente
        run: python -c "import agente.app, agente.mcp, agente.simbiosis, agente.vinculado"

      - name: docker-compose válido
        run: docker compose config -q
