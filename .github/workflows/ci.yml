name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Score live, Oráculo, acceso e invariantes (sin red), con cobertura
        # Piso: cobertura medida tras integrar los cinco agentes (65.81%, 2026-10-12). Sube; no baja.
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=65

      - name: Score de escritorio
        run: node --test packages/score/score.test.mjs

      - name: Smoke import del API
        working-directory: services/api
        run: python -c "import atlas.score, atlas.main, atlas.access, atlas.oracle"

      - name: docker-compose válido
        run: docker compose config -q
