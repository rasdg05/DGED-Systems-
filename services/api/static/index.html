<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DGED Atlas</title>
  <link rel="stylesheet" href="/static/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true" class="mark">
          <path d="M16 2 28 9v14L16 30 4 23V9Z" />
          <path d="M16 8 24 12.5v9L16 26 8 21.5v-9Z" />
          <path d="M16 8v18M8 12.5 24 21.5M24 12.5 8 21.5" />
        </svg>
        <div>
          <p class="word">DGED SYSTEMS</p>
          <h1>Atlas</h1>
        </div>
      </div>
      <p class="lede">Cribado de sitios industriales con INEGI y el monitor de sequía de CONAGUA. El número no afirma megawatts.</p>
      <div class="header-actions">
        <button type="button" id="score-all">Calificar sitios</button>
        <button type="button" id="toggle-sources" class="ghost">Fuentes</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="list-pane">
        <div class="filters" role="tablist">
          <button type="button" class="chip on" data-corridor="">Todos</button>
          <button type="button" class="chip" data-corridor="norte">Norte</button>
          <button type="button" class="chip" data-corridor="bajio">Bajío</button>
        </div>
        <label class="scenario">
          <input id="drought-year" type="checkbox" />
          Año seco: la sequía no baja de D2
        </label>
        <ol id="site-list"></ol>
      </aside>
      <main id="map"></main>
      <aside class="detail" id="detail">
        <p class="empty">Elige un sitio. El municipio, la sequía y el uso de suelo salen de la consulta, no de una ficha escrita a mano.</p>
      </aside>
    </div>
    <section class="sources" id="sources" hidden></section>
  </div>
  <script src="/static/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
